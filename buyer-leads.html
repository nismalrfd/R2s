<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buyer Leads — R2s Realtors</title>
  <link rel="stylesheet" href="/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script> 
  <link rel="icon" href="/LOGO.png" type="image/png" /> 
</head> 

<body class="bg-[#FAFBFF] min-h-screen"> 
 
  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-gray-100"> 
    <div class="max-w-5xl mx-auto px-4 md:px-8 py-4 flex items-center justify-between"> 
      <div class="flex items-center gap-3"> 
        <a href="/dashboard.html" class="w-10 h-10 rounded-xl bg-gray-50 border border-gray-100 flex items-center justify-center text-gray-500 hover:text-slate-950 transition-colors"> 
          <i data-lucide="arrow-left" class="w-5 h-5"></i> 
        </a> 
        <h1 class="text-lg font-extrabold text-slate-950">Buyer Leads</h1> 
      </div> 

      <button id="addBuyerBtn" onclick="toggleAddBuyerModal()" class="hidden bg-red-600 hover:bg-red-700 hover:-translate-y-0.5 text-white px-5 py-2.5 rounded-full text-sm font-bold shadow-[0_4px_15px_rgba(220,38,38,0.3)] transition-all flex items-center gap-2"> 
        <i data-lucide="user-plus" class="w-4 h-4"></i> Add Buyer 
      </button> 
    </div> 
  </header> 
 
  <main class="max-w-5xl mx-auto px-4 md:px-8 py-8"> 

    <div id="notAuthorizedMsg" class="hidden bg-amber-50 border border-amber-100 text-amber-700 text-sm font-semibold px-5 py-4 rounded-2xl mb-6"> 
      Adding Buyer Leads is available only to Realtors, Channel Partners, Associates, and NRI Clients. 
    </div> 

    <div id="leadsError" class="hidden bg-red-50 border border-red-100 text-red-600 text-sm font-semibold px-5 py-4 rounded-2xl mb-6"></div> 
 
    <div id="leadsList" class="flex flex-col gap-4"></div> 

    <div id="emptyState" class="hidden text-center py-20"> 
      <i data-lucide="users" class="w-10 h-10 text-gray-300 mx-auto mb-3"></i> 
      <p class="text-gray-400 font-semibold">No buyer leads yet.</p> 
    </div> 

  </main> 
 
  <!-- Add Buyer Lead Modal --> 
  <div id="addBuyerModal" class="fixed inset-0 z-[900] hidden items-center justify-center p-4"> 
    <div class="absolute inset-0 bg-slate-950/60 backdrop-blur-sm" onclick="toggleAddBuyerModal()"></div> 

    <div class="relative bg-white rounded-[32px] w-full max-w-lg p-6 md:p-8 shadow-2xl"> 

      <div class="flex items-center justify-between mb-6"> 
        <h2 class="text-xl font-extrabold text-slate-950">Add Buyer Lead</h2> 

        <button onclick="toggleAddBuyerModal()" class="w-9 h-9 rounded-full bg-gray-50 flex items-center justify-center hover:bg-red-50 hover:text-red-600 transition-colors"> 
          <i data-lucide="x" class="w-4 h-4"></i> 
        </button> 
      </div> 
 
      <form id="addBuyerForm" onsubmit="submitBuyerLead(event)" class="flex flex-col gap-5"> 

        <div class="flex flex-col gap-2"> 
          <label class="text-[10px] font-bold text-gray-500 uppercase tracking-wider">
            Buyer Name *
          </label> 

          <input 
            type="text" 
            id="buyer_name" 
            required 
            class="w-full bg-gray-50 rounded-2xl px-5 py-3.5 border border-gray-200 outline-none focus:border-blue-500 focus:bg-white transition-colors text-slate-950 font-semibold"
          > 
        </div> 

        <!-- Contact Number — CHANGED: always collects the full 10-digit
             number now (the old "tick to add full number" checkbox is
             gone), but only the last 4 digits are shown on screen while
             typing (e.g. XXXXXX7890). The eye button reveals the actual
             digits typed so far, for verification, without re-typing. -->
        <div class="flex flex-col gap-2"> 
          <label class="text-[10px] font-bold text-gray-500 uppercase tracking-wider">
            Contact Number *
          </label> 

          <input 
            type="text" 
            inputmode="numeric" 
            autocomplete="off"
            id="buyer_contact" 
            required 
            placeholder="10-digit mobile number" 
            class="w-full bg-gray-50 rounded-2xl px-5 py-3.5 border border-gray-200 outline-none focus:border-blue-500 focus:bg-white transition-colors text-slate-950 font-semibold tracking-wider"
          >

          <div class="flex items-start gap-3 mt-1">
            <input type="checkbox" id="buyer_contact_check" class="mt-0.5 w-4 h-4 rounded border-gray-300 text-red-600 focus:ring-red-500 cursor-pointer" onchange="toggleBuyerContactReveal(this.checked)">
            <label for="buyer_contact_check" class="text-[12px] font-semibold text-gray-600 cursor-pointer">Show full number</label>
          </div>
        </div>

        <div class="flex flex-col gap-1 mt-2"> 
          <label class="text-[10px] font-bold text-gray-500 uppercase tracking-wider">
            Preferred Location or Project *
          </label> 

          <input 
            type="text" 
            id="buyer_preferred_location" 
            required 
            placeholder="e.g. Kochi, Kerala" 
            class="w-full bg-gray-50 rounded-2xl px-5 py-3.5 border border-gray-200 outline-none focus:border-blue-500 focus:bg-white transition-colors text-slate-950 font-semibold"
          > 
          <p class="text-[10px] text-gray-400 font-semibold italic px-1 mt-1">We won't contact your project without your permission</p>
        </div> 
 
        <div class="flex items-start gap-3 pt-2 border-t border-gray-100 mt-1"> 

          <input 
            type="checkbox" 
            id="buyer_consent" 
            required 
            class="mt-1 w-5 h-5 rounded border-gray-300 text-red-600 focus:ring-red-500 cursor-pointer"
          > 

          <label for="buyer_consent" class="text-sm font-semibold text-slate-950 cursor-pointer">
            I have obtained the lead owner's (buyer's) permission to add them to the network and share their name and contact number with R2s Realtors.
          </label> 

        </div> 
 
        <button 
          type="submit" id="saveBuyerLeadBtn"
          class="w-full bg-red-600 hover:bg-red-700 text-white px-6 py-4 rounded-2xl font-bold shadow-lg transition-colors flex items-center justify-center gap-2 mt-2"
        > 
          Save Buyer Lead 
          <i data-lucide="check-circle" class="w-5 h-5"></i> 
        </button> 

      </form> 
    </div> 
  </div> 
 
  <script> 

    function getProfile() { 
      const identity = localStorage.getItem('r2s_current_user'); 
      const raw = identity ? localStorage.getItem('r2s_profile_' + identity) : null; 
      return raw ? JSON.parse(raw) : null; 
    } 

    // Req. 7.1: only these three roles may add a Buyer Lead.
    const ALLOWED_ROLES = ['nar', 'partner', 'agent', 'associate', 'nri']; 

    // ==================== Contact Number masking ====================
    // CHANGED: previously this field either collected only the last 4
    // digits, or (if a checkbox was ticked) the full number in plain
    // text — and toggling that checkbox wiped whatever was already
    // typed. Now the field always collects the full 10-digit number;
    // `buyerContactDigits` holds the real value, while the visible
    // input only ever displays a masked version (or the real thing,
    // while the eye toggle is active). beforeinput is used instead of
    // reading the field's own value, since the field's value is masked
    // text, not the real digits.
    let buyerContactDigits = '';
    let buyerContactRevealed = false;

    function maskBuyerContact(digits) {
      if (digits.length <= 4) return digits;
      return 'X'.repeat(digits.length - 4) + digits.slice(-4);
    }

    function renderBuyerContactField() {
      const input = document.getElementById('buyer_contact');
      if (!input) return;
      input.value = buyerContactRevealed ? buyerContactDigits : maskBuyerContact(buyerContactDigits);
    }

    function toggleBuyerContactReveal(isChecked) {
      buyerContactRevealed = !!isChecked;
      renderBuyerContactField();
    }

    function resetBuyerContactField() {
      buyerContactDigits = '';
      buyerContactRevealed = false;
      const checkbox = document.getElementById('buyer_contact_check');
      if (checkbox) checkbox.checked = false;
      renderBuyerContactField();
    }

    function initBuyerContactMasking() {
      const input = document.getElementById('buyer_contact');
      if (!input || input.dataset.maskingBound) return;
      input.dataset.maskingBound = 'true';

      // beforeinput fires before the field's own value changes, and
      // tells us exactly what the user did (typed a digit, pasted,
      // backspaced) via e.inputType / e.data — so we can update the
      // real digits and then fully control what's displayed.
      input.addEventListener('beforeinput', (e) => {
        e.preventDefault();

        if (
          e.inputType === 'insertText' ||
          e.inputType === 'insertFromPaste' ||
          e.inputType === 'insertFromDrop'
        ) {
          const incoming = (e.data || '').replace(/\D/g, '');
          if (incoming) {
            buyerContactDigits = (buyerContactDigits + incoming).slice(0, 10);
          }
        } else if (
          e.inputType === 'deleteContentBackward' ||
          e.inputType === 'deleteContentForward'
        ) {
          buyerContactDigits = buyerContactDigits.slice(0, -1);
        } else if (
          e.inputType === 'deleteByCut' ||
          e.inputType === 'deleteContent'
        ) {
          buyerContactDigits = '';
        }

        renderBuyerContactField();
      });

      // Fallback for older browsers where a pasted value doesn't show
      // up in beforeinput's e.data.
      input.addEventListener('paste', (e) => {
        if (buyerContactDigits) return; // beforeinput already handled it
        const text = (e.clipboardData || window.clipboardData)?.getData('text') || '';
        const digits = text.replace(/\D/g, '');
        if (digits) {
          buyerContactDigits = digits.slice(0, 10);
          renderBuyerContactField();
        }
      });
    }
    // ==================================================================

    function toggleAddBuyerModal() { 
      const modal = document.getElementById('addBuyerModal');
      modal.classList.toggle('hidden'); 
      modal.classList.toggle('flex'); 

      if (!modal.classList.contains('hidden')) {
        resetBuyerContactField();
      }
    }  

    // Last buyer list CRM returned, and a counter so a slow, older response
    // can never overwrite a newer one.
    let lastServerLeads = [];
    let loadSeq = 0;

    function renderLeads(leads) { 

      const list = document.getElementById('leadsList'); 
      const empty = document.getElementById('emptyState'); 

      if (!leads || leads.length === 0) { 
        list.innerHTML = ''; 
        empty.classList.remove('hidden'); 
        return; 
      } 

      empty.classList.add('hidden'); 

      // Masked number (last 4 digits) with an eye button to reveal the
      // full number — see BuyerLeadUI in main.js.
      BuyerLeadUI.bind(list);
      BuyerLeadUI.render(list, leads);

    } 

    async function loadLeads(profile) { 

      const seq = ++loadSeq;

      try { 

        const res = await fetch(
          `/api/get-buyer-leads?role=${encodeURIComponent(profile.role)}&recordId=${encodeURIComponent(profile.crmRecordId)}`
        ); 

        const result = await res.json(); 

        if (!result.success) {
          throw new Error(result.error || 'Failed to load leads'); 
        }

        lastServerLeads = result.leads;

      } catch (err) { 

        console.error(err); 

        const errBox = document.getElementById('leadsError'); 
        errBox.textContent = 'Could not load buyer leads: ' + err.message; 
        errBox.classList.remove('hidden'); 

      } 

      if (seq !== loadSeq) return; // a newer load is already in charge

      // Buyers saved a moment ago may not be in CRM's search results yet —
      // keep showing them until CRM returns them.
      renderLeads(R2sPending.merge('buyerlead', lastServerLeads));

    } 

    async function submitBuyerLead(e) { 

      e.preventDefault(); 

      const profile = getProfile(); 

      if (!profile || !ALLOWED_ROLES.includes(profile.role)) { 
        return showPremiumAlert('error'); 
      } 

      if (!document.getElementById('buyer_consent').checked) return; 

      // CHANGED: the real number now lives in buyerContactDigits (the
      // visible field only ever shows masked or fully-revealed text,
      // never something safe to read back with .value). Require a full
      // 10-digit number before allowing submission.
      if (buyerContactDigits.length !== 10) {
        const input = document.getElementById('buyer_contact');
        input.setCustomValidity('Enter the full 10-digit mobile number.');
        input.reportValidity();
        return;
      }
      document.getElementById('buyer_contact').setCustomValidity('');

      const submitBtn = document.getElementById('saveBuyerLeadBtn');
      if (submitBtn?.dataset.submitting === 'true') return;
      if (submitBtn) {
        submitBtn.dataset.submitting = 'true';
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Saving...';
        if (typeof lucide !== 'undefined') lucide.createIcons();
      }

      const payload = { 
        formType: 'buyerlead', 

        // These names are kept exactly as the existing API expects.
        // Backend maps them to Zoho CRM Leads fields.
        buyerName: document.getElementById('buyer_name').value, 
        buyerContact: buyerContactDigits, 
        preferredLocation: document.getElementById('buyer_preferred_location').value, 

        consentGiven: 'Yes', 
        consentAt: new Date().toISOString(), 

        linkRole: profile.role, 
        linkId: profile.crmRecordId, 
      }; 
 
      try { 

        const res = await window.fetchWithTimeout('/api/submit-to-zoho', { 
          method: 'POST', 
          headers: { 
            'Content-Type': 'application/json' 
          }, 
          body: JSON.stringify(payload), 
        }, 30000); 

        const result = await res.json(); 

        if (!result.success) {
          throw new Error(result.error || 'Zoho rejected the record'); 
        } 

        showPremiumAlert('success'); 

        document.getElementById('addBuyerForm').reset(); 
        resetBuyerContactField();

        toggleAddBuyerModal(); 

        // Show the new buyer straight away instead of waiting for CRM's
        // search index (which is why the list needed a manual refresh).
        if (result.zohoRecordId) {
          R2sPending.add('buyerlead', {
            id: result.zohoRecordId,
            buyerName: payload.buyerName,
            buyerContact: payload.buyerContact,
            buyerContactMasked: maskPhoneNumber(payload.buyerContact),
            preferredLocation: payload.preferredLocation,
            createdAt: new Date().toISOString(),
          });
        }
        renderLeads(R2sPending.merge('buyerlead', lastServerLeads));

        loadLeads(profile); // quiet background refresh from CRM

      } catch (err) { 

        console.error('Buyer lead submission failed:', err); 
        showPremiumAlert('error'); 

      } 

    } 

    (function init() { 

      const profile = getProfile(); 

      if (!profile) { 
        window.location.href = '/login.html'; 
        return; 
      } 

      if (ALLOWED_ROLES.includes(profile.role)) { 

        document.getElementById('addBuyerBtn').classList.remove('hidden'); 

        loadLeads(profile); 

      } else { 

        document.getElementById('notAuthorizedMsg').classList.remove('hidden'); 
        document.getElementById('emptyState').classList.add('hidden'); 

      } 

      initBuyerContactMasking();

      if (typeof lucide !== 'undefined') lucide.createIcons(); 

    })(); 

  </script> 
 
  <script src="/main.js"></script> 

</body> 
</html>
